<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}B站本地分析{% endblock %}</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #687586;
      --line: #d9dee7;
      --accent: #0f766e;
      --danger: #b42318;
      --warning: #a15c00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
      letter-spacing: 0;
    }
    header {
      background: #263238;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 18px; margin: 0; font-weight: 650; }
    nav a { color: white; text-decoration: none; margin-left: 16px; font-size: 14px; }
    main { max-width: 1280px; margin: 0 auto; padding: 24px; }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 18px;
      margin-bottom: 18px;
      overflow-x: auto;
    }
    h2 { font-size: 17px; margin: 0 0 14px; }
    h3 { font-size: 15px; margin: 16px 0 10px; }
    form.inline { display: inline; }
    .row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
    .row > *, form { min-width: 0; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
    input, select {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 7px 9px;
      font-size: 14px;
      background: white;
      max-width: 100%;
      font-family: inherit;
    }
    textarea {
      width: 100%;
      max-width: 100%;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 8px 9px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      background: white;
      margin-bottom: 8px;
    }
    input[name="video_input"] { min-width: min(620px, 90vw); }
    button, .button {
      border: 1px solid #176b63;
      background: var(--accent);
      color: white;
      border-radius: 4px;
      padding: 8px 11px;
      font-size: 14px;
      line-height: 1.2;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
    }
    button.secondary, .button.secondary { background: white; color: var(--accent); }
    button.danger { background: var(--danger); border-color: var(--danger); }
    table { width: 100%; min-width: 680px; border-collapse: collapse; font-size: 14px; }
    th, td { border-bottom: 1px solid var(--line); padding: 10px 8px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
    th { color: var(--muted); font-weight: 600; background: #fbfcfd; }
    .actions { display: flex; gap: 6px; flex-wrap: wrap; min-width: 280px; }
    .actions form.inline { display: inline-flex; }
    .badge { display: inline-block; border-radius: 999px; padding: 3px 8px; font-size: 12px; background: #e8f4f2; color: #14534d; }
    .badge.error { background: #fde8e7; color: var(--danger); }
    .badge.paused { background: #fff3d6; color: var(--warning); }
    .message { border-radius: 4px; padding: 10px 12px; margin-bottom: 18px; background: #e8f4f2; }
    .message.error { background: #fde8e7; color: var(--danger); }
    .muted, .empty { color: var(--muted); }
    .page-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(230px, 100%), 1fr)); gap: 12px; }
    .metric { border: 1px solid var(--line); border-radius: 6px; padding: 12px; background: #fbfcfd; }
    .metric span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .metric strong { font-size: 20px; overflow-wrap: anywhere; }
    .chart-block { width: 100%; overflow-x: auto; }
    .chart-block .plotly-graph-div { width: 100% !important; max-width: 100%; }
    .chart-panel, .nested-panel { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 12px; }
    .chart-panel > summary, .nested-panel > summary { cursor: pointer; color: var(--text); font-weight: 650; }
    .nested-panel { margin-left: 0; }
    .compare-form { margin: 10px 0 12px; }
    .word-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
    .word-chip { border: 1px solid var(--line); background: #fbfcfd; border-radius: 999px; padding: 5px 9px; font-size: 13px; }
    .word-chip strong { color: var(--accent); margin-left: 4px; }
    code { background: #eef1f5; padding: 2px 4px; border-radius: 3px; }
    @media (max-width: 760px) {
      main { padding: 14px; }
      section { padding: 14px; }
      header { padding: 12px 14px; align-items: flex-start; gap: 8px; flex-direction: column; }
      nav { display: flex; gap: 12px; flex-wrap: wrap; }
      nav a { margin-left: 0; }
      .row { display: grid; grid-template-columns: 1fr; align-items: stretch; }
      .row > *, .row input, .row select { width: 100%; }
      input[name="video_input"] { min-width: 100%; width: 100%; }
      button, .button { width: 100%; text-align: center; }
      .page-actions { display: grid; grid-template-columns: 1fr; }
      .actions { min-width: 0; display: grid; grid-template-columns: 1fr; }
      .actions form.inline { display: block; }
      .grid { grid-template-columns: 1fr; }
      .metric strong { font-size: 18px; }
      table { min-width: 620px; font-size: 13px; }
    }
  </style>
  {% if needs_plotly %}
    <script src="/assets/plotly.min.js"></script>
  {% endif %}
</head>
<body>
  <header>
    <h1>B站公开视频本地分析</h1>
    <nav>
      <a href="/">返回首页</a>
      <a href="/settings">设置</a>
    </nav>
  </header>
  <main>
    {% if message %}
      <div class="message {{ level }}">{{ message }}</div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  <script>
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function refreshLogs() {
      const body = document.querySelector("[data-log-body]");
      if (!body) return;
      const bvid = body.dataset.bvid;
      const limit = body.dataset.limit || "30";
      const url = new URL("/api/logs", window.location.origin);
      url.searchParams.set("limit", limit);
      if (bvid) url.searchParams.set("bvid", bvid);
      try {
        const response = await fetch(url, { cache: "no-store" });
        if (!response.ok) return;
        const data = await response.json();
        body.innerHTML = (data.logs || []).map((log) => {
          const detail = log.detail ? `<br><span class="muted">${escapeHtml(log.detail)}</span>` : "";
          const bvid = body.dataset.showBvid === "1" ? `<td>${escapeHtml(log.bvid || "-")}</td>` : "";
          return `<tr><td>${escapeHtml(log.created_at)}</td><td>${escapeHtml(log.level)}</td>${bvid}<td>${escapeHtml(log.message)}${detail}</td></tr>`;
        }).join("");
      } catch (_) {
      }
    }

    if (document.querySelector("[data-log-body]")) {
      window.setInterval(refreshLogs, 5000);
    }

    for (const toggle of document.querySelectorAll("[data-toggle-password]")) {
      toggle.addEventListener("change", () => {
        const target = document.getElementById(toggle.dataset.togglePassword);
        if (target) target.type = toggle.checked ? "text" : "password";
      });
    }
  </script>
</body>
</html>
