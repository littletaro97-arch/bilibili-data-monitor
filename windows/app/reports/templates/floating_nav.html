
<nav id="floating-nav" class="floating-nav" hidden aria-label="详情页目录"><div id="floating-nav-menu" class="floating-nav-menu"><div class="nav-highlight" aria-hidden="true" hidden></div></div></nav>
<script>
(() => {
  const key='bilibili-detail-navigation',nav=document.getElementById('floating-nav'),menu=document.getElementById('floating-nav-menu');
  const targets=[...document.querySelectorAll('[data-nav-title]')];
  let preferences=window.bllaNavigationPreferences||{enabled:true,side:'right'};
  try{const saved=JSON.parse(localStorage.getItem(key)||'{}');preferences={enabled:saved.enabled!==false,side:saved.side==='left'?'left':'right'};}catch{}
  const apply=()=>{
    nav.hidden=!preferences.enabled||targets.length<2;nav.dataset.side=preferences.side;
    document.documentElement.dataset.detailNav=String(preferences.enabled);
    document.documentElement.dataset.navSide=preferences.side;
  };
  const links=new Map(),indicator=menu.querySelector('.nav-highlight');
  let active=null;
  function activate(link){
    if(link===active)return;
    for(const a of links.values())a.removeAttribute('aria-current');link.setAttribute('aria-current','location');active=link;
    const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
    indicator.style.transition=indicator.hidden||reduced?'none':'';
    indicator.hidden=false;indicator.style.height=`${link.offsetHeight}px`;indicator.style.transform=`translateY(${link.offsetTop}px)`;
  }
  new ResizeObserver(()=>{if(active){indicator.style.height=`${active.offsetHeight}px`;indicator.style.transform=`translateY(${active.offsetTop}px)`;}}).observe(menu);
  for(const [index,target] of targets.entries()){
    if(!target.id)target.id=`detail-section-${index}`;
    const a=document.createElement('a');a.href='#'+target.id;a.textContent=`${String(index+1).padStart(2,'0')} ${target.dataset.navTitle}`;
    a.onclick=e=>{
      e.preventDefault();let ancestor=target;
      while(ancestor){if(ancestor.tagName==='DETAILS')ancestor.open=true;ancestor=ancestor.parentElement;}
      target.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'start'});
      activate(a);
    };menu.append(a);links.set(target,a);
  }
  if(targets.length && 'IntersectionObserver' in window){
    const observer=new IntersectionObserver(entries=>{
      const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top);
      if(visible.length)activate(links.get(visible[0].target));
    },{rootMargin:'-5% 0px -70% 0px'});targets.forEach(target=>observer.observe(target));
  }
  const form=document.getElementById('navigation-preferences');
  if(form){
    const enabled=document.getElementById('navigation-enabled'),side=document.getElementById('navigation-side');enabled.checked=preferences.enabled;side.value=preferences.side;
    const save=()=>{preferences={enabled:enabled.checked,side:side.value};window.bllaNavigationPreferences=preferences;try{localStorage.setItem(key,JSON.stringify(preferences));apply();document.getElementById('navigation-status').hidden=true;}catch{document.getElementById('navigation-status').hidden=false;document.getElementById('navigation-status').textContent='当前环境无法保存偏好。';}};
    enabled.addEventListener('change',save);side.addEventListener('change',save);form.onsubmit=e=>e.preventDefault();
  }
  window.addEventListener('storage',e=>{if(e.key===key){try{const saved=JSON.parse(e.newValue||'{}');preferences={enabled:saved.enabled!==false,side:saved.side==='left'?'left':'right'};apply();}catch{}}});
  apply();if(links.size)activate(links.values().next().value);
})();
</script>
