<style>
#text-inspection { overflow-x:clip; }
.inspection-heading,.inspection-title { display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
.inspection-heading p { margin:0 0 14px; font-size:13px; }
.inspection-collect { gap:6px; align-items:center; } .inspection-collect select { width:auto; }
