<details id="full-text-control" class="chart-panel"><summary>自动采集与手动续采</summary>
  <p class="muted">先到<a href="/settings#bili-account">设置扫码登录</a>。带分 P 参数的任务仅抓指定 P，其余自动任务默认遍历全部 P；手动任务按所选范围读取 6 分钟分段；评论读取稿件共用评论区及楼中楼。平台可能隐藏或截断内容，接口遍历结束不等于完整历史。</p>
  <form id="full-text-form" class="actions"><label>内容<select id="full-text-kind"><option value="danmaku">分段弹幕</option><option value="comments">评论及楼中楼</option></select></label><label>弹幕范围<select id="full-text-scope"><option value="selected">{% if task and task.selected_page %}仅任务 P{{ task.selected_page }}{% else %}仅下方所选 P{% endif %}</option>{% if not task or not task.selected_page %}<option value="all">全部 P</option>{% endif %}</select></label><label><input id="full-text-continuous" type="checkbox">连续遍历到接口结束</label><button type="submit">开始遍历</button></form>
  <p id="full-text-channels" class="muted" role="status"></p>
  <p id="full-text-progress" role="status">尚未开始</p>
  <div class="actions"><button type="button" class="secondary" id="full-text-pause" hidden>暂停</button><button type="button" id="full-text-resume" hidden>从断点继续</button><a class="button secondary" data-refresh-page href="/videos/{{ video.bvid }}#text-inspection">刷新本地结果</a></div>
  <p class="muted">正文随视频统计安排，未完成时从断点持续采集，评论与弹幕分批轮转。统计间隔不会中断上一轮正文；未登录或平台限制时保留进度。已抓到的原文不会因后续未返回而丢弃。</p>
</details>
<script>
(() => {
  const base='/api/text/jobs/{{ video.bvid }}', progress=document.getElementById('full-text-progress');
  const pause=document.getElementById('full-text-pause'), resume=document.getElementById('full-text-resume');
  let job=null,timer=null,allJobs=[];
  async function request(action,body){
    const finish=action?window.bllaLoading?.start(document.activeElement):null;
    try{
    const r=await fetch(base+(action?'/'+action:''),{method:action?'POST':'GET',headers:{'Content-Type':'application/json'},body:action?JSON.stringify(body):undefined});
    const d=await r.json();if(!r.ok)throw Error(d.error||d.detail||'采集操作失败');allJobs=d.jobs||[];return d.job;
    }finally{finish?.();}
  }
  function show(value){
    job=allJobs.find(j=>j.kind===document.getElementById('full-text-kind').value)||value;
    document.getElementById('full-text-channels').textContent=allJobs.map(j=>`${j.kind==='comments'?'评论':'弹幕'}：${j.message}`).join(' · ');if(!job)return;
    progress.textContent=`${job.kind==='comments'?'评论及楼中楼':'分段弹幕'} · 已处理 ${job.responses} 批次 · 累计读取 ${job.received} 条 · 新增 ${job.saved_new??0} 条 · 已保存/重复 ${job.saved_existing??0} 条${job.legacy_received?` · 旧任务前 ${job.legacy_received} 条未记录新增计数`:""}${job.unavailable_roots?` · 不可见根评论 ${job.unavailable_roots} 条（原文保留）`:''}${job.owner_profile?` · ${job.owner_profile==='backup'?'备用账号':'主账号'}`:''}${job.handoffs?` · 已接管 ${job.handoffs} 次`:''} · ${job.message}${job.retry_after?` · 冷却剩余 ${job.retry_after} 秒`:''}`;
    if(job.kind==='danmaku' && job.status!=='complete')progress.textContent+=` · 第 ${Math.min(job.part_index+1,job.parts.length)} / ${job.parts.length} 个 P，第 ${job.segment} 段`;
    pause.hidden=!['running','queued','retry_wait','waiting_login'].includes(job.status);resume.hidden=!['paused','waiting_login'].includes(job.status);resume.disabled=job.retry_after>0;
    document.getElementById('full-text-form').querySelector('button').disabled=job.status!=='complete';
  }
  async function poll(){
    clearTimeout(timer);
    try{if(!document.hidden && !(typeof panelHidden==='function' && await panelHidden()))show(await request());}catch(e){progress.textContent=e.message;}
    timer=setTimeout(poll,3000);
  }
  async function act(action,body){clearTimeout(timer);try{show(await request(action,body));}catch(e){progress.textContent=e.message;}finally{timer=setTimeout(poll,3000);}}
  document.getElementById('full-text-form').onsubmit=e=>{
    e.preventDefault();act('start',{continuous:document.getElementById('full-text-continuous').checked,kind:document.getElementById('full-text-kind').value,scope:document.getElementById('full-text-scope').value,cid:document.getElementById('text-part').value});
  };
  document.getElementById('full-text-kind').onchange=poll;
  pause.onclick=()=>act('cancel',{id:job.id});resume.onclick=()=>act('resume',{id:job.id});
  window.addEventListener('pagehide',()=>clearTimeout(timer),{once:true});poll();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
})();
</script>
