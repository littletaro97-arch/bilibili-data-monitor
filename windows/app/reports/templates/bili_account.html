<style>
.manual-session{margin-top:14px;border:1px solid var(--line);border-radius:6px;padding:12px}
.manual-session>summary{font-size:14px} .manual-session .details-body{padding-top:12px}
#bili-session-form{display:grid;gap:10px}#bili-session-form label{margin:0}#bili-session-form input{box-sizing:border-box;width:100%}#bili-session-form button{justify-self:start}
.account-profile-tabs{margin-bottom:14px}.account-profile-tabs [aria-pressed="true"]{background:var(--accent);color:#fff}
.account-status-card{border:1px solid var(--line);border-radius:6px;background:var(--soft);padding:14px;margin-bottom:14px}
.account-status-card p{margin:6px 0;overflow-wrap:anywhere}.account-status-heading{display:flex;justify-content:space-between;gap:12px;align-items:center}
.account-status-card .badge{white-space:nowrap}.account-note{font-size:13px;margin:12px 0;color:var(--muted)}
</style>
<section id="bili-account">
  <h2>Bilibili 登录采集</h2>
  <div class="account-profile-tabs actions"><button type="button" class="secondary" id="bili-profile-primary" aria-pressed="true">主账号</button><button type="button" class="secondary" id="bili-profile-backup" aria-pressed="false">备用账号（推荐）</button></div>
  <div class="account-status-card">
    <div class="account-status-heading"><strong id="bili-profile-title">主账号</strong><span id="bili-account-badge" class="badge">读取中</span></div>
    <p id="bili-auth-status" aria-live="polite">正在读取登录状态…</p>
    <p id="bili-profile-summary" class="muted" aria-live="polite"></p>
  </div>
  <p class="account-note" id="bili-account-note">一个账号即可采集；备用账号可从断点接管。</p>
  <div class="actions"><button type="button" id="bili-qr">扫码登录</button><button type="button" class="secondary" id="bili-logout">退出登录</button><button type="button" class="secondary" id="bili-verify">验证登录态</button></div>
  <img id="bili-qr-image" alt="请用 Bilibili 手机客户端扫码" width="200" height="200" hidden style="margin-top:12px;max-width:200px">
  <details class="manual-session"><summary>手动填写 SESSDATA</summary><form id="bili-session-form"><label for="bili-session">SESSDATA</label><input id="bili-session" type="password" autocomplete="off" maxlength="4096" required><button type="submit" class="secondary">验证并保存</button></form><p class="account-note">仅供扫码不可用时使用，请勿分享。</p></details>
  <p class="account-note">登录态由当前 Windows 用户加密保存。</p>
</section>
<script>
(() => {
  const status=document.getElementById('bili-auth-status'), image=document.getElementById('bili-qr-image');
  let timer=null,pending=false,profile='primary',generation=0;
  const visible=async()=>!document.hidden && !(typeof panelHidden==='function' && await panelHidden());
  const stop=()=>{generation++;pending=false;clearTimeout(timer);image.hidden=true;image.removeAttribute('src');};
  async function request(action,body) {
    const finish=action && action!=='poll'?window.bllaLoading?.start(document.activeElement):null;
    try{
    const response=await fetch('/api/text/auth'+(action?'/'+action:''),{method:action?'POST':'GET',headers:{'Content-Type':'application/json'},body:action?JSON.stringify({...body,profile}):undefined});
    const data=await response.json();if(!response.ok) throw Error(data.error||data.detail||'登录操作失败');return data;
    }finally{finish?.();}
  }
  function show(data){if(data.profiles){document.getElementById('bili-profile-summary').textContent=Object.entries(data.profiles).map(([key,v])=>`${key==='primary'?'主账号':'备用账号'}：${v.saved?v.verification==='expired'?'需重新登录':'已保存':'未登录'}`).join(' · ');data=data.profiles[profile];}status.textContent=(data.saved?`${data.name} · `:'')+data.message+(data.last_verified_at?` · 上次有效验证：${new Date(data.last_verified_at).toLocaleString()}`:'');
    const badge=document.getElementById('bili-account-badge');badge.textContent=!data.saved?'未登录':data.verification==='expired'?'需重新登录':data.verification==='valid'?'验证有效':'已保存，待验证';badge.className='badge '+(data.verification==='valid'?'running':'interrupted');
    document.getElementById('bili-profile-title').textContent=profile==='primary'?'主账号':'备用账号';
    for(const key of ['primary','backup'])document.getElementById('bili-profile-'+key).setAttribute('aria-pressed',String(key===profile));window.dispatchEvent(new Event('bllaAuthRender'));}
  async function poll(){
    if(!pending)return;const expected=generation;
    try{
      if(await visible()){
        const data=await request('poll');if(expected!==generation)return;
        if(data.status==='ok'){stop();show(data);return;}
        if(['expired','error'].includes(data.status)){stop();status.textContent='二维码过期或登录失败，请重新申请。';return;}
        status.textContent=data.status==='scanned'?'已扫码，请在手机确认。':'请用 Bilibili 客户端扫码。';
      }
      timer=setTimeout(poll,3000);
    }catch(e){stop();status.textContent=e.message;}
  }
  for(const key of ['primary','backup'])document.getElementById('bili-profile-'+key).onclick=()=>{stop();profile=key;request().then(show).catch(e=>status.textContent=e.message);};
  document.getElementById('bili-qr').onclick=async()=>{
    stop();const expected=generation;try{const data=await request('qr');if(expected!==generation)return;image.src=data.image;image.hidden=false;window.bllaMotion?.enter(image);pending=true;poll();}catch(e){status.textContent=e.message;}
  };
  document.getElementById('bili-verify').onclick=async e=>{const button=e.currentTarget;button.disabled=true;try{show(await request('verify'));}catch(error){status.textContent=error.message;}finally{button.disabled=false;}};
  document.getElementById('bili-logout').onclick=async()=>{stop();try{show(await request('logout'));}catch(e){status.textContent=e.message;}};
  document.getElementById('bili-session-form').onsubmit=async e=>{
    e.preventDefault();stop();const input=document.getElementById('bili-session');const value=input.value;input.value='';
    try{show(await request('save',{sessdata:value}));}catch(e){status.textContent=e.message;}
  };
  window.addEventListener('pagehide',stop,{once:true});
  request().then(show).catch(e=>{status.textContent=e.message;});
})();
</script>
