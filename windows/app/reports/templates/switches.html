{% macro switch_card(id, title, icon, name='', checked=false, hint='', toggle_target='') %}
<label class="switch-card" for="{{ id }}">
  <span class="switch-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    {% if icon == 'console' %}<rect x="3" y="4" width="18" height="16" rx="3"/><path d="m7 9 3 3-3 3m6 0h4"/>
    {% elif icon == 'network' %}<rect x="7" y="3" width="10" height="7" rx="2"/><path d="M12 10v4M5 17v-3h14v3"/><rect x="2" y="17" width="6" height="4" rx="1"/><rect x="16" y="17" width="6" height="4" rx="1"/>
    {% else %}<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>{% endif %}
  </svg></span>
  <span class="switch-copy"><span class="switch-title" id="{{ id }}-title">{{ title }}</span>{% if hint %}<span class="switch-hint" id="{{ id }}-hint">{{ hint }}</span>{% endif %}</span>
  <input id="{{ id }}" type="checkbox" role="switch" aria-labelledby="{{ id }}-title" {% if hint %}aria-describedby="{{ id }}-hint"{% endif %} {% if name %}name="{{ name }}"{% endif %} {% if checked %}checked{% endif %} {% if toggle_target %}data-toggle-password="{{ toggle_target }}"{% endif %}>
  <span class="switch-track" aria-hidden="true"></span>
</label>
{% endmacro %}
